# Developer starter: synchronous API, web and database supplied for local practice.
name: insighthub-sdlc
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: insighthub
      POSTGRES_PASSWORD: insighthub
      POSTGRES_DB: insighthub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighthub -d insighthub"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
  api:
    build: ./api
    environment:
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3107}","http://127.0.0.1:${WEB_PORT:-3107}"]'
      DATABASE_URL: postgresql://insighthub:insighthub@postgres:5432/insighthub
      RAG_MODE: ${RAG_MODE:-fixture}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fixture}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
      INGESTION_TIMEOUT_SECONDS: ${INGESTION_TIMEOUT_SECONDS:-120}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-200000}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      MIGRATION_PATH: /app/migrations
    ports: ["127.0.0.1:${API_PORT:-8107}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1g
  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
      MUTATION_ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-3107},http://127.0.0.1:${WEB_PORT:-3107}"
    ports: ["127.0.0.1:${WEB_PORT:-3107}:3000"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
  web-check:
    profiles: ["checks"]
    build:
      context: ./web
      target: builder
    command: ["sh", "-c", "npm run typecheck && npm test"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    profiles: ["ollama"]
    volumes: ["ollama-data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # CPU container is optional. On macOS prefer native Ollama for Metal.
volumes:
  pgdata:
  ollama-data:
